name: Bootstrap published Triton package

on:
  push:
    branches: [fix/triton-runtime-integration]
    paths: [.github/workflows/triton-package-bootstrap.yml]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - name: Resolve published compiler and lockfile
        run: |
          npm install --workspace deckpilot-triton --save-exact @cristianormazabal/triton-core@0.3.30 --ignore-scripts
          npm pack @cristianormazabal/triton-core@0.3.30
      - uses: actions/upload-artifact@v4
        with:
          name: published-triton-package
          path: |
            package-lock.json
            cristianormazabal-triton-core-0.3.30.tgz